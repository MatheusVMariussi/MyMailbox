name: Checks

on:
  pull_request:
  push:
    branches: [main, mymailbox]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Lint, the type check and one test read the generated migration bundle.
      - run: npm run db:bundle
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: node --test tests/*.test.mjs
      - run: npm run build
