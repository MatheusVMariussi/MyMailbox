<!doctype html>
<!-- Static on purpose: this is served from the service worker cache while offline, outside the app's i18n
     (catalogs load over the network and the locale comes from a server-read cookie), so it carries both languages. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Offline · MyMailbox</title>
<style>
:root { color-scheme: dark light; --bg: #07080a; --surface: #0d0f12; --line: #23272f; --fg: #f4f6fa; --muted: #8b929e; --accent: #4f8cff; --button: #2a64f6; }
@media (prefers-color-scheme: light) { :root { --bg: #f2f3f6; --surface: #ffffff; --line: #e2e5ea; --fg: #0d0f12; --muted: #5f6672; --accent: #2a64f6; } }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
body { display: flex; min-height: 100dvh; align-items: center; justify-content: center; padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px, env(safe-area-inset-left)); box-sizing: border-box; }
main { max-width: 380px; padding: 32px 28px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); }
.prompt { font: 500 13px/1 "JetBrains Mono", ui-monospace, "SF Mono", monospace; color: var(--muted); }
.prompt b { color: var(--accent); font-weight: 500; }
.caret { display: inline-block; width: 8px; height: 14px; margin-left: 4px; vertical-align: -2px; background: var(--fg); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
h1 { font-size: 22px; margin: 20px 0 8px; font-weight: 600; letter-spacing: -0.01em; }
p { margin: 0 0 6px; color: var(--muted); }
p + p { margin-bottom: 24px; }
button { font: inherit; font-weight: 500; padding: 10px 20px; border: 0; border-radius: 999px; background: var(--button); color: #fff; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
<div class="prompt"><b>~/</b>mymailbox $ ping<span class="caret"></span></div>
<h1>Sem conexão</h1>
<p>Não consegui falar com o servidor agora. Confere a internet e tenta de novo.</p>
<p lang="en">You are offline. Check your connection and try again.</p>
<button type="button" onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
